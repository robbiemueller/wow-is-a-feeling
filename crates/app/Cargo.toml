[package]
name = "wow-is-a-feeling"
description = "A lightweight, free addon manager for World of Warcraft: Forever, with a vanilla feel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "wow-is-a-feeling"
path = "src/main.rs"

[dependencies]
feeling-core.workspace = true
serde_json.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "accesskit", "clipboard", "links", "system_fonts", "wayland", "x11"] }
egui = "=0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log.workspace = true

# Load Wayland at runtime, so the same binary also starts on X11-only systems.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = "=0.37.0"
tempfile = "3"
zip.workspace = true
