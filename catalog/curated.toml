[[kits]]
name = "New to Forever"
description = "Everything you need for your first week: quest help, a map that knows where to go, gear advice and a damage meter."
addons = [
  "gh:Questie/Questie",
  "gh:openmap-world/openmap",
  "wowi:7032",
  "gh:fusionpit/WhatsTraining",
  "gh:VgerMods/Pawn",
  "gh:Tercioo/Details-Damage-Meter",
]

[[kits]]
name = "Raid night"
description = "Boss timers, nameplates you can read, numbers for afterward, and a warning when you're standing in the bad stuff."
