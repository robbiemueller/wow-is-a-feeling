# Which addon a GitHub entry is. Every GitHub entry is pinned to its addon's main folder: a
# new build that doesn't ship it is taken for another addon from the same repository, such
# as a module or a data pack, and passed over. The folder is the one written here, or else
# the one the last catalog listed the entry with. The build summary names every entry that
# passed over a newer release, so look there for a rename or an entry listing the wrong addon.
# main is the folder that identifies the addon. was lists main folders it really had before,
# up to 8: installed copies still under one of them keep getting its updates. Entries of a
# [[split]] repository below aren't pinned, because their tag prefixes already decide.
#
# foreversixty's nightly data pack, ForeverSixtyData, had taken the addon's place.
[pins."gh:jhunthrop/foreversixty"]
main = "ForeverSixty"

# Repositories that publish several addons, each under its own tag prefix, as tags like
# <prefix>/v1.2.3. The repository's own entry, gh:owner/repo, reads only main's tags. Each
# line is an entry of its own, gh:owner/repo/<line> in lower case, and reads only its tags.
# Tags under any other prefix are never read. The repository must be in seeds.toml too, and
# each line needs a name and summary under [overrides], because a pack's TOC only describes
# one of its folders. A line's prefix takes letters, digits and dashes.
#
# Spoken's other prefixes are its desktop app (manager, launcher), retired packs and
# languages nobody has checked against Spoken 3.8 yet.
[[split]]
repo = "rusty-key/spoken-wow"
main = "spoken"
lines = ["quests-audio", "places-audio", "readables-audio", "bosses-audio"]

# Addons that go with another, written down because neither side's TOC says so. Each group
# has a name, whether the addon does nothing useful without it (needed), and the ids that
# will do, in the order to offer them: any one of them meets it. met_by is up to 8 folder
# name prefixes that meet it too, for packs the catalog doesn't list, such as other
# languages or ones another tool installed, so nobody is told their own voices are missing.
# The app shows them on the addon's page and asks before installing any. Naming an id here
# hand-picks it.
#
# Spoken's packs, from what Spoken itself loads. SpokenQuestsAudio starts every official
# quest pack: each language's, CurseForge's Alliance, Horde, Shared and Gossip splits, and
# the older single-folder ones such as SpokenQuestsAudio_deDE. Community packs are all named
# SpokenCommunity_<id> whatever they voice, so that prefix can't stand for quest voices.
# SpokenZonesAudio and SpokenBooksAudio are the older Places and Readables packs, which
# Spoken still reads.
[[packs]]
addon = "gh:rusty-key/spoken-wow"
name = "Quest voices"
needed = true
ids = ["gh:rusty-key/spoken-wow/quests-audio"]
met_by = ["SpokenQuestsAudio"]

[[packs]]
addon = "gh:rusty-key/spoken-wow"
name = "Place voices"
ids = ["gh:rusty-key/spoken-wow/places-audio"]
met_by = ["SpokenPlacesAudio", "SpokenZonesAudio"]

[[packs]]
addon = "gh:rusty-key/spoken-wow"
name = "Readable voices"
ids = ["gh:rusty-key/spoken-wow/readables-audio"]
met_by = ["SpokenReadablesAudio", "SpokenBooksAudio"]

[[packs]]
addon = "gh:rusty-key/spoken-wow"
name = "Boss voices"
ids = ["gh:rusty-key/spoken-wow/bosses-audio"]
met_by = ["SpokenBossesAudio"]

[exclude]
# These accounts mirror other people's addons. Authors have filed DMCA notices
# against mirrors, and we never want to send players to one.
owners = ["hippuli", "curseforge-mirror"]
repos = [
  "andi-74/foreverdungeonjournal-mirror",
  # Unofficial mirrors and ports of ElvUI, whose code is all rights reserved.
  "ogri-la/elvui",
  "ogri-la/tukui",
  "orbit0r/ElvUI-Forever",
  # A code template for addon authors, not something to play with.
  "RGXMods/RGX-Hello",
  # Bots for a private server kit, not for the live game.
  "Karrz1/Karrz-playerbots-wow-forever",
]
ids = []

# Names and summaries where an addon's own text doesn't work on its own, and
# boosts where the numbers undercount: GitHub only shows us recent releases, and a
# source install has no downloads to count at all. A boost of 1 is worth roughly
# ten times the downloads.
[overrides."gh:Questie/Questie"]
summary = "Shows quest givers, objectives and turn-ins on your map and minimap."
boost = 3.0

[overrides."gh:Tercioo/Details-Damage-Meter"]
summary = "See damage, healing and more for everyone in your group."
category = "combat"
boost = 8.0

[overrides."gh:DeadlyBossMods/DeadlyBossMods"]
name = "Deadly Boss Mods"
summary = "Timers and warnings for raid and dungeon bosses."
boost = 2.5

[overrides."gh:DeadlyBossMods/DBM-Dungeons"]
name = "Deadly Boss Mods: Dungeons"

[overrides."gh:Tercioo/Plater-Nameplates"]
boost = 2.0

[overrides."gh:RestedXP/RXPGuides"]
boost = 1.5

[overrides."gh:EllesmereGaming/EllesmereUI"]
summary = "A complete interface replacement with its own in-game editor."
boost = 1.5

[overrides."gh:Nevcairiel/GatherMate2"]
category = "professions"

[overrides."gh:kemayo/wow-silverdragon"]
category = "maps"

[overrides."gh:AznamirWoW/PallyPower"]
category = "combat"

[overrides."gh:vuhdo-io/VuhDo"]
name = "VuhDo"

[overrides."gh:RaiderIO/raiderio-addon"]
name = "Raider.IO"

[overrides."direct:foreverdb"]
category = "misc"

# Spoken's voice packs, from [[split]]. The quests pack's own title names only its Alliance
# folder, though it holds the Horde, shared and gossip ones too. Each name says its
# language, because Spoken has packs in several and these are the English ones.
