alternatives = ["gh:EllesmereGaming/EllesmereUI", "gh:fallenguards/classicuiforever"]

# Tags but no packaged zips. The app installs GitHub's source archive using the
# moves worked out here. A .pkgmeta with externals is refused, because the archive
# wouldn't include those libraries. That is ElvUI's situation today: it stays
# listed so it appears by itself if that ever changes.
[[source]]
repo = "tukui-org/ElvUI"
folders = ["ElvUI", "ElvUI_Libraries", "ElvUI_Options"]

[[source]]
repo = "Tercioo/Details-Damage-Meter"

[[source]]
repo = "CaptainBritish/GnomeLevelUp"

# Their own manifest, with a checksum. GPL-3.0, attribution in the summary.
[[direct]]
id = "direct:foreverdb"
manifest = "https://foreverdb.net/downloads/addon-manifest.json"
key = "addon"
site = "https://foreverdb.net"
name = "ForeverDB"
author = "ForeverDB"
website = "https://foreverdb.net"

[exclude]
# These accounts mirror other people's addons. Authors have filed DMCA notices
# against mirrors, and we never want to send players to one.
owners = ["hippuli", "curseforge-mirror"]
repos = ["andi-74/foreverdungeonjournal-mirror"]
ids = []

[overrides."gh:Tercioo/Details-Damage-Meter"]
category = "combat"
boost = 4.0
