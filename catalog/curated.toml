  "gh:Questie/Questie",
  "gh:RestedXP/RXPGuides",
  "gh:Tercioo/Details-Damage-Meter",
  "gh:DeadlyBossMods/DeadlyBossMods",
  "gh:BigWigsMods/BigWigs",
  "gh:tukui-org/ElvUI",
  "gh:Nevcairiel/Bartender4",
