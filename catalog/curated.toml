# Tags but no packaged zips. The app installs GitHub's source archive using the
# moves worked out here. A .pkgmeta with externals is refused, because the archive
# wouldn't include those libraries, and so is one with git submodules. That is
# ElvUI's situation today: it stays listed so it appears by itself if that changes.
[[source]]
repo = "tukui-org/ElvUI"
folders = ["ElvUI", "ElvUI_Libraries", "ElvUI_Options"]

