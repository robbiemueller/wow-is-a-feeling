# Hand-picked parts of the catalog. See docs/DESIGN.md.
# Ids look like gh:owner/repo, wowi:1234 or direct:name. The builder drops any
# reference that isn't in the catalog and warns about it.

# Shown first, in this order. Roughly what a new player sets up first.
