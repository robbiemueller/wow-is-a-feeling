# Hand-picked parts of the catalog. See docs/DESIGN.md.
# Ids look like gh:owner/repo, wowi:1234 or direct:name, and a release line from [[split]]
# below is gh:owner/repo/<line>. The builder drops any reference that isn't in the catalog
# and warns about it.
