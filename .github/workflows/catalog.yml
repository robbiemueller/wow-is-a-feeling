name: Catalog

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "crates/catalog-builder/**"
      - "crates/core/src/catalog.rs"
      - "crates/core/src/toc.rs"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

# Two builds at once would race for the catalog branch and waste API calls.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The first full WoWInterface scan is slow on purpose. Later runs take minutes.
    timeout-minutes: 300
    env:
      # This tool is run once and thrown away, so build it quickly rather than small.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: catalog-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: catalog-${{ runner.os }}-

      - name: Build the tool
        run: cargo build --release --locked -p feeling-catalog

      - name: Restore the previous catalog and scan cache
        run: |
          mkdir -p previous out
          if git fetch --quiet --depth=1 origin catalog; then
            git show FETCH_HEAD:catalog.json > previous/catalog.json || rm -f previous/catalog.json
            git show FETCH_HEAD:catalog-state.json > previous/catalog-state.json || rm -f previous/catalog-state.json
          else
            echo "No catalog branch yet, starting from nothing."
          fi

      # The tool stops starting new work at 270 minutes and still writes everything.
      # This step's own timeout only catches a hang, and the scan cache was being
      # saved along the way, so even then the next run picks up from here.
      - name: Build the catalog
        id: build
        continue-on-error: true
        timeout-minutes: 285
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(build --out out --seeds catalog/seeds.toml --curated catalog/curated.toml --max-minutes 270)
          if [ -f previous/catalog.json ]; then args+=(--previous previous/catalog.json); fi
          if [ -f previous/catalog-state.json ]; then args+=(--state previous/catalog-state.json); fi
          ./target/release/feeling-catalog "${args[@]}"

      # Runs after a failed or cut-off build too, so scan progress is never lost.
      # A refused catalog is simply not there, and the previous one stays published.
      - name: Publish to the catalog branch
        if: always()
        run: |
          if [ ! -f out/catalog-state.json ]; then
            echo "The build saved nothing, so there's nothing to publish."
            exit 0
          fi
          if [ ! -f out/catalog.json ] && [ -f previous/catalog.json ]; then
            cp previous/catalog.json out/catalog.json
          fi

          without_timestamp() { sed -E 's/"generated":[0-9]+/"generated":0/' "$1"; }
          catalog_unchanged=false
          if [ -f previous/catalog.json ] && [ -f out/catalog.json ] &&
            cmp -s <(without_timestamp previous/catalog.json) <(without_timestamp out/catalog.json); then
            # Same bytes, same ETag, so the app doesn't download it again.
            cp previous/catalog.json out/catalog.json
            catalog_unchanged=true
          fi
          state_unchanged=false
          if [ -f previous/catalog-state.json ] && cmp -s previous/catalog-state.json out/catalog-state.json; then
            state_unchanged=true
          fi
          if [ "$catalog_unchanged" = true ] && [ "$state_unchanged" = true ]; then
            echo "Nothing changed, skipping the push."
            exit 0
          fi

          mkdir publish
          cp out/catalog-state.json publish/
          if [ -f out/catalog.json ]; then cp out/catalog.json publish/; fi
          cat > publish/README.md <<'EOF'
          # Catalog data

          Generated by `.github/workflows/catalog.yml` on the main branch and replaced
          as one fresh commit on every build, so this branch never grows.

          - `catalog.json` is what the app downloads. It lists addons and points at
            their authors' own downloads. No addon files are stored here.
          - `catalog-state.json` is the builder's scan cache.
          EOF

          # A single new commit with no parent, built without touching the checkout.
          export GIT_INDEX_FILE="$RUNNER_TEMP/catalog-index"
          git --work-tree=publish add --all .
          tree=$(git write-tree)
          commit=$(git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" -m "Update the catalog")
          git push --force origin "$commit:refs/heads/catalog"

      - name: Report a failed build
        if: steps.build.outcome != 'success'
        run: |
          echo "The catalog build failed or was cut off. See the step above for why."
          exit 1
