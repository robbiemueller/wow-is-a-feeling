name: Release

# To release: set the version in Cargo.toml, commit the Cargo.lock that changes with it, write
# the version's section in CHANGELOG.md, merge that, then push the matching tag, like v0.2.0.
#
# Every installed app trusts the signing key and can't stop trusting it, so the jobs keep it
# away from as much as they can, and each job holds only what it needs:
#
#   check-tag              Stops here unless the tag is a plain version matching Cargo.toml.
#   windows, linux, macos  Build the app.
#   signer                 Builds xtask-sign, alone, so only minisign's crates compile there.
#   manifest               Checks what the builds made and writes latest.json.
#   sign                   The only job with the key. No token, no source and no compiler.
#   verify                 Checks the signature with the key built into the app.
#   publish                The only job that can write to the repository. Runs nothing built here.
#
# Only GitHub's own actions run in this workflow, each pinned to a commit. When bumping a pin,
# use a commit on the action's default branch, and the commit rather than an annotated tag's
# own id. Nothing here restores a cache, because pushes to main write caches tag runs can read.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # The first thing that runs. Every other job waits for this one.
  check-tag:
    runs-on: ubuntu-22.04
    steps:
      - name: Check the tag looks like a release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME isn't a release tag, so nothing was built. Release tags look like v1.2.3. Pre-releases aren't published, because every player would be offered them."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "wow-is-a-feeling") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml, so nothing was built. The app would keep offering players the build they already have. Set the version in Cargo.toml, then delete this tag and tag that commit."
            exit 1
          fi

  windows:
    needs: check-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      # PowerShell, the shell CI builds with on Windows.
      - run: cargo build --release --locked -p wow-is-a-feeling
        shell: pwsh
      - name: Collect
        run: |
          mkdir dist
          cp target/release/wow-is-a-feeling.exe dist/wow-is-a-feeling-windows-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: check-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libfuse2
      - name: Fetch appimagetool and its runtime
        run: |
          # Fixed releases, checked before anything runs them. The runtime becomes the first
          # bytes of the AppImage, and the tool can touch everything in this job, so whatever
          # arrives here gets signed and reaches players. Bump these on purpose.
          curl -fsSL --retry 3 --retry-all-errors -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 3 --retry-all-errors -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum --check --strict <<'EOF'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          EOF
          chmod +x appimagetool
      - run: cargo build --release --locked -p wow-is-a-feeling
      - name: Package
        run: |
          mkdir dist
          bin=target/release/wow-is-a-feeling

          # A gzipped binary, for the in-app updater.
          gzip -9 -c "$bin" > dist/wow-is-a-feeling-linux-x64.gz

          # A tarball, for people who like to unpack things themselves.
          mkdir -p pkg/wow-is-a-feeling
          cp "$bin" packaging/linux/wow-is-a-feeling.desktop README.md LICENSE pkg/wow-is-a-feeling/
          cp assets/icon/png/icon-256.png pkg/wow-is-a-feeling/wow-is-a-feeling.png
          tar -C pkg -czf dist/wow-is-a-feeling-linux-x64.tar.gz wow-is-a-feeling

          # An AppImage, the one-file way to run it.
          appdir=AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp "$bin" "$appdir/usr/bin/"
          cp packaging/linux/wow-is-a-feeling.desktop "$appdir/"
          cp packaging/linux/wow-is-a-feeling.desktop "$appdir/usr/share/applications/"
          cp assets/icon/png/icon-256.png "$appdir/wow-is-a-feeling.png"
          cp assets/icon/png/icon-256.png "$appdir/usr/share/icons/hicolor/256x256/apps/wow-is-a-feeling.png"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/wow-is-a-feeling" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          # --appimage-extract-and-run has to come first, or the AppImage's runtime won't see it.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --runtime-file runtime-x86_64 "$appdir" dist/wow-is-a-feeling-linux-x64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: check-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - name: Build both architectures
        run: |
          cargo build --release --locked -p wow-is-a-feeling --target aarch64-apple-darwin
          cargo build --release --locked -p wow-is-a-feeling --target x86_64-apple-darwin
      - name: Bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="dist-app/WoW is a Feeling.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/wow-is-a-feeling" \
            target/aarch64-apple-darwin/release/wow-is-a-feeling \
            target/x86_64-apple-darwin/release/wow-is-a-feeling
          cp assets/icon/icon.icns "$app/Contents/Resources/icon.icns"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Apple silicon refuses to run anything with no signature at all. This is
          # an ad-hoc signature, not a notarized one, so first launch needs Open Anyway.
          codesign --force --deep -s - "$app"
          mkdir dist
          ditto -c -k --keepParent "$app" dist/wow-is-a-feeling-macos-universal.zip
          hdiutil create -volname "WoW is a Feeling" -srcfolder dist-app -ov -format UDZO dist/wow-is-a-feeling-macos-universal.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # A job of its own, so a build script from the rest of the tree can't touch this binary.
  signer:
    needs: check-tag
    runs-on: ubuntu-22.04
    # Job outputs can't be changed by any other job, unlike artifacts, so the sign job checks
    # the tool against this before the key is anywhere near it.
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: cargo build --locked -p xtask --no-default-features --bin xtask-sign
      - name: Hash the signing tool
        id: hash
        run: echo "digest=$(sha256sum target/debug/xtask-sign | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signer
          path: target/debug/xtask-sign
          if-no-files-found: error

  manifest:
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    # What sign and publish check their downloads against: the release files as a set, and
    # latest.json, which only covers the four files the app updates from.
    outputs:
      assets: ${{ steps.hash.outputs.assets }}
      manifest: ${{ steps.hash.outputs.manifest }}
      tool: ${{ steps.hash.outputs.tool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: cargo build --locked -p xtask
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: artifacts/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: artifacts/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: artifacts/macos
      - name: Gather assets
        run: |
          # Each build's files by name, and then nothing may be left. So a build can't add a
          # file to the release, or replace another build's file by naming its own the same.
          mkdir release
          take() {
            local from=$1
            shift
            for name in "$@"; do
              mv "artifacts/$from/$name" release/
            done
          }
          take windows wow-is-a-feeling-windows-x64.exe
          take linux wow-is-a-feeling-linux-x64.gz wow-is-a-feeling-linux-x64.tar.gz wow-is-a-feeling-linux-x64.AppImage
          take macos wow-is-a-feeling-macos-universal.zip wow-is-a-feeling-macos-universal.dmg
          if [ -n "$(find artifacts ! -type d)" ]; then
            echo "::error::A build made files that aren't part of a release, so nothing was published:"
            find artifacts ! -type d
            exit 1
          fi
          ls -l release
      - name: Write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section of CHANGELOG.md for this version becomes the notes the app shows.
          awk -v v="$version" '
            $0 ~ "^## \\[?"v"\\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $version." > notes.md
      - name: Write latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          target/debug/xtask make-latest --version "$version" --notes-file notes.md --assets-dir release --base-url "$base"
          mkdir manifest
          mv release/latest.json manifest/
      - name: Hash what goes on
        id: hash
        run: |
          assets=$(cd release && sha256sum -- * | LC_ALL=C sort -k2 | sha256sum | cut -c1-64)
          manifest=$(sha256sum manifest/latest.json | cut -c1-64)
          tool=$(sha256sum target/debug/xtask | cut -c1-64)
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: manifest/latest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool
          path: target/debug/xtask
          if-no-files-found: error

  # The only job with the signing key, and the key is only in the one step that uses it. It
  # has no token, no source and no compiler. The download and upload actions have no post
  # steps, and no other code runs here.
  sign:
    needs: [signer, manifest]
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      signature: ${{ steps.hash.outputs.signature }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signer
          path: signer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: manifest
      - name: Check the signing tool and manifest are the ones their jobs made
        env:
          SIGNER: ${{ needs.signer.outputs.digest }}
          MANIFEST: ${{ needs.manifest.outputs.manifest }}
        run: |
          test -n "$SIGNER" && test -n "$MANIFEST"
          echo "$SIGNER  signer/xtask-sign" | sha256sum --check --strict
          echo "$MANIFEST  manifest/latest.json" | sha256sum --check --strict
      - run: chmod +x signer/xtask-sign
      - name: Sign latest.json
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: signer/xtask-sign manifest/latest.json
      - name: Hash the signature
        id: hash
        run: echo "signature=$(sha256sum manifest/latest.json.minisig | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: manifest/latest.json.minisig
          if-no-files-found: error

  # Apart from publish, because the full xtask links far more crates than a job holding the
  # write token should run.
  verify:
    needs: [sign, manifest]
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool
          path: tool
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: release
      - name: Check the tool, manifest and signature are the ones their jobs made
        env:
          TOOL: ${{ needs.manifest.outputs.tool }}
          MANIFEST: ${{ needs.manifest.outputs.manifest }}
          SIGNATURE: ${{ needs.sign.outputs.signature }}
        run: |
          test -n "$TOOL" && test -n "$MANIFEST" && test -n "$SIGNATURE"
          echo "$TOOL  tool/xtask" | sha256sum --check --strict
          echo "$MANIFEST  release/latest.json" | sha256sum --check --strict
          echo "$SIGNATURE  release/latest.json.minisig" | sha256sum --check --strict
      - name: Check the signature with the key built into the app
        run: |
          chmod +x tool/xtask
          tool/xtask verify-latest release/latest.json

  publish:
    needs: [verify, manifest, sign]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: release
      - name: Check these are exactly the files the manifest job made
        env:
          ASSETS: ${{ needs.manifest.outputs.assets }}
          MANIFEST: ${{ needs.manifest.outputs.manifest }}
          SIGNATURE: ${{ needs.sign.outputs.signature }}
        run: |
          test -n "$ASSETS" && test -n "$MANIFEST" && test -n "$SIGNATURE"
          expected=$(printf '%s\n' latest.json latest.json.minisig \
            wow-is-a-feeling-linux-x64.AppImage wow-is-a-feeling-linux-x64.gz \
            wow-is-a-feeling-linux-x64.tar.gz wow-is-a-feeling-macos-universal.dmg \
            wow-is-a-feeling-macos-universal.zip wow-is-a-feeling-windows-x64.exe | LC_ALL=C sort)
          found=$(cd release && ls -1A | LC_ALL=C sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::The release files aren't the expected set, so nothing was published:"
            echo "$found"
            exit 1
          fi
          echo "$MANIFEST  release/latest.json" | sha256sum --check --strict
          echo "$SIGNATURE  release/latest.json.minisig" | sha256sum --check --strict
          assets=$(cd release && sha256sum -- wow-is-a-feeling-* | LC_ALL=C sort -k2 | sha256sum | cut -c1-64)
          if [ "$assets" != "$ASSETS" ]; then
            echo "::error::The release files changed after the manifest job hashed them, so nothing was published."
            exit 1
          fi
      - name: Check each asset against the signed hashes
        run: |
          jq -r '.assets[] | "\(.sha256)  \(.url | split("/") | last)"' release/latest.json > signed-hashes
          (cd release && sha256sum --check --strict ../signed-hashes)
      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # With --draft, gh won't stop at a release that already has this tag, so stop here.
          if gh release view "$GITHUB_REF_NAME" --json url --jq .url; then
            echo "::error::$GITHUB_REF_NAME already has a release or a draft, so nothing changed. To try again, delete the draft and run this job again. A published release stays as it is, and a new one needs a new version."
            exit 1
          fi

          jq -r .notes release/latest.json > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "WoW is a Feeling $GITHUB_REF_NAME" \
            --notes-file notes.md

          # Players can't see a draft, so nothing is public until GitHub's copy has been read
          # back and found to be byte for byte what was checked above.
          gh release download "$GITHUB_REF_NAME" --dir stored
          if ! diff -r release stored; then
            echo "::error::GitHub's copy of the release isn't what was signed, so it stays a draft and players can't see it. Delete the draft, then run this job again."
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

          # The links the app will follow, the way anyone reaches them. If one is wrong, the
          # release goes back to being a draft rather than offering an update that can't work.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          public_ok=true
          for url in $(jq -r '.assets[].url' release/latest.json) "$base/latest.json" "$base/latest.json.minisig"; do
            curl -fsSL --retry 5 --retry-all-errors -o public-copy "$url" &&
              cmp public-copy "release/${url##*/}" || public_ok=false
          done
          if [ "$public_ok" != true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=true
            echo "::error::A public link in this release doesn't give what was signed, so it's a draft again and players can't see it. See which link in the lines above. Delete the draft, then run this job again."
            exit 1
          fi
