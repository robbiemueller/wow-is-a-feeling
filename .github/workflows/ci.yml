name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxkbcommon-x11-0 xvfb libgl1-mesa-dri
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint the signing tool, built the way a release builds it
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p xtask --no-default-features --bin xtask-sign -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast

  smoke:
    name: Screenshot on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libxkbcommon-x11-0 xvfb libgl1-mesa-dri
      - name: Build
        run: cargo build --release -p wow-is-a-feeling
      - name: Run and screenshot (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" timeout 60 ./target/release/wow-is-a-feeling --demo --screenshot screenshot-linux.png
      - name: Run and screenshot (macOS)
        if: runner.os == 'macOS'
        run: |
          ./target/release/wow-is-a-feeling --demo --screenshot screenshot-macos.png &
          app=$!
          for _ in $(seq 1 60); do
            if [ -f screenshot-macos.png ]; then break; fi
            sleep 1
          done
          kill "$app" 2>/dev/null || true
          test -f screenshot-macos.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-${{ runner.os }}
          path: screenshot-*.png
          if-no-files-found: error
      - name: Report binary size
        shell: bash
        run: ls -l target/release/wow-is-a-feeling
